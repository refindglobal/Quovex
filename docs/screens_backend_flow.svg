<svg viewBox="0 0 1600 950" xmlns="http://www.w3.org/2000/svg" style="background-color: #0A0F0D; font-family: 'Inter', system-ui, sans-serif;">
  
  <defs>
    <!-- Emerald Green Arrow for Client -> Server -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00C896" />
    </marker>
    <!-- Orange Arrow for Internal Cloud/Backend routing -->
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFB800" />
    </marker>
    
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111917" />
      <stop offset="100%" stop-color="#1A2B24" />
    </linearGradient>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1612" />
      <stop offset="100%" stop-color="#2D2214" />
    </linearGradient>
    <linearGradient id="ai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1215" />
      <stop offset="100%" stop-color="#2D1A1F" />
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="800" y="60" fill="#00C896" font-size="32" font-weight="bold" text-anchor="middle">Quovex — Complete Screen-to-Backend Architecture Flow</text>
  <text x="800" y="90" fill="#8AAFA3" font-size="16" text-anchor="middle">Mapping how Jetpack Compose Screens interact with Local Cache, Firebase, and AI Providers</text>

  <!-- COLUMN HEADERS -->
  <text x="175" y="140" fill="#FFFFFF" font-size="20" font-weight="bold" text-anchor="middle">📱 Android Screens</text>
  <text x="475" y="140" fill="#FFFFFF" font-size="20" font-weight="bold" text-anchor="middle">💾 Local Database</text>
  <text x="825" y="140" fill="#FFFFFF" font-size="20" font-weight="bold" text-anchor="middle">☁️ Firebase Platform</text>
  <text x="1275" y="140" fill="#FFFFFF" font-size="20" font-weight="bold" text-anchor="middle">🤖 External Services &amp; AI</text>

  <!-- ========================================== -->
  <!-- 📱 1. ANDROID SCREENS (Left Column) -->
  <!-- ========================================== -->
  <!-- Onboarding -->
  <rect x="50" y="170" width="250" height="60" rx="12" fill="url(#screen-grad)" stroke="#00C896" stroke-width="2"/>
  <text x="175" y="205" fill="#E8F5F0" font-size="16" font-weight="bold" text-anchor="middle">Onboarding &amp; Auth</text>

  <!-- Home / Dashboard -->
  <rect x="50" y="270" width="250" height="60" rx="12" fill="url(#screen-grad)" stroke="#00C896" stroke-width="2"/>
  <text x="175" y="305" fill="#E8F5F0" font-size="16" font-weight="bold" text-anchor="middle">Home Dashboard</text>

  <!-- Timer & Study Session -->
  <rect x="50" y="370" width="250" height="60" rx="12" fill="url(#screen-grad)" stroke="#00C896" stroke-width="2"/>
  <text x="175" y="405" fill="#E8F5F0" font-size="16" font-weight="bold" text-anchor="middle">Study Timer &amp; Focus</text>

  <!-- Notes & Flashcards -->
  <rect x="50" y="470" width="250" height="60" rx="12" fill="url(#screen-grad)" stroke="#00C896" stroke-width="2"/>
  <text x="175" y="505" fill="#E8F5F0" font-size="16" font-weight="bold" text-anchor="middle">Notes &amp; Flashcards</text>

  <!-- AI Chat & Doubt Solver -->
  <rect x="50" y="570" width="250" height="60" rx="12" fill="url(#screen-grad)" stroke="#00C896" stroke-width="2"/>
  <text x="175" y="605" fill="#E8F5F0" font-size="16" font-weight="bold" text-anchor="middle">AI Chat &amp; Doubt Solver</text>

  <!-- Study Rooms -->
  <rect x="50" y="670" width="250" height="60" rx="12" fill="url(#screen-grad)" stroke="#00C896" stroke-width="2"/>
  <text x="175" y="705" fill="#E8F5F0" font-size="16" font-weight="bold" text-anchor="middle">Community Study Rooms</text>

  <!-- Premium / Ads -->
  <rect x="50" y="770" width="250" height="60" rx="12" fill="url(#screen-grad)" stroke="#00C896" stroke-width="2"/>
  <text x="175" y="805" fill="#E8F5F0" font-size="16" font-weight="bold" text-anchor="middle">Premium &amp; Settings</text>


  <!-- ========================================== -->
  <!-- 💾 2. LOCAL DB (Middle Left) -->
  <!-- ========================================== -->
  <rect x="400" y="370" width="150" height="260" rx="12" fill="#1C2B24" stroke="#34D399" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="475" y="400" fill="#34D399" font-size="16" font-weight="bold" text-anchor="middle">Room DB</text>
  <text x="475" y="430" fill="#8AAFA3" font-size="12" text-anchor="middle">(Offline Cache)</text>
  <text x="475" y="470" fill="#E8F5F0" font-size="14" text-anchor="middle">Sessions Table</text>
  <text x="475" y="510" fill="#E8F5F0" font-size="14" text-anchor="middle">Flashcards Table</text>
  <text x="475" y="550" fill="#E8F5F0" font-size="14" text-anchor="middle">Notes Cache</text>
  <text x="475" y="590" fill="#E8F5F0" font-size="14" text-anchor="middle">Study Plans</text>


  <!-- ========================================== -->
  <!-- ☁️ 3. FIREBASE PLATFORM (Middle Right) -->
  <!-- ========================================== -->
  <!-- Auth -->
  <rect x="700" y="170" width="250" height="60" rx="12" fill="url(#cloud-grad)" stroke="#FFB800" stroke-width="2"/>
  <text x="825" y="205" fill="#FFB800" font-size="16" font-weight="bold" text-anchor="middle">Firebase Auth</text>

  <!-- Firestore -->
  <rect x="700" y="270" width="250" height="130" rx="12" fill="url(#cloud-grad)" stroke="#FFB800" stroke-width="2"/>
  <text x="825" y="300" fill="#FFB800" font-size="16" font-weight="bold" text-anchor="middle">Firestore DB</text>
  <text x="825" y="330" fill="#E8F5F0" font-size="14" text-anchor="middle">users/{uid}</text>
  <text x="825" y="350" fill="#E8F5F0" font-size="14" text-anchor="middle">study_rooms/{id}</text>
  <text x="825" y="370" fill="#E8F5F0" font-size="14" text-anchor="middle">leaderboard/</text>

  <!-- Storage -->
  <rect x="700" y="450" width="250" height="60" rx="12" fill="url(#cloud-grad)" stroke="#FFB800" stroke-width="2"/>
  <text x="825" y="485" fill="#FFB800" font-size="16" font-weight="bold" text-anchor="middle">Firebase Storage (PDFs)</text>

  <!-- Cloud Functions -->
  <rect x="700" y="560" width="250" height="120" rx="12" fill="url(#cloud-grad)" stroke="#FFB800" stroke-width="2"/>
  <text x="825" y="590" fill="#FFB800" font-size="16" font-weight="bold" text-anchor="middle">Cloud Functions</text>
  <text x="825" y="620" fill="#E8F5F0" font-size="14" text-anchor="middle">AI API Gateway Proxy</text>
  <text x="825" y="640" fill="#E8F5F0" font-size="14" text-anchor="middle">Key Rotation &amp; Limits</text>
  <text x="825" y="660" fill="#E8F5F0" font-size="14" text-anchor="middle">PDF Text Extractor</text>


  <!-- ========================================== -->
  <!-- 🤖 4. EXTERNAL APIs (Right Column) -->
  <!-- ========================================== -->
  <!-- Groq -->
  <rect x="1150" y="490" width="250" height="100" rx="12" fill="url(#ai-grad)" stroke="#FF5252" stroke-width="2"/>
  <text x="1275" y="525" fill="#FF5252" font-size="16" font-weight="bold" text-anchor="middle">Groq API (4 Keys)</text>
  <text x="1275" y="555" fill="#E8F5F0" font-size="14" text-anchor="middle">openai/gpt-oss-120b</text>
  <text x="1275" y="575" fill="#E8F5F0" font-size="14" text-anchor="middle">openai/gpt-oss-20b</text>

  <!-- Cerebras -->
  <rect x="1150" y="620" width="250" height="90" rx="12" fill="url(#ai-grad)" stroke="#6C63FF" stroke-width="2"/>
  <text x="1275" y="655" fill="#6C63FF" font-size="16" font-weight="bold" text-anchor="middle">Cerebras API (4 Keys)</text>
  <text x="1275" y="685" fill="#E8F5F0" font-size="14" text-anchor="middle">gemma-4-31b</text>

  <!-- Monetization -->
  <rect x="1150" y="750" width="250" height="80" rx="12" fill="#111917" stroke="#34D399" stroke-width="2"/>
  <text x="1275" y="785" fill="#34D399" font-size="16" font-weight="bold" text-anchor="middle">Monetization</text>
  <text x="1275" y="810" fill="#E8F5F0" font-size="14" text-anchor="middle">AdMob + Play Billing</text>


  <!-- ========================================== -->
  <!-- 🔗 CONNECTING ARROWS & LABELS -->
  <!-- ========================================== -->

  <!-- Onboarding -> Auth -->
  <path d="M 300 200 L 685 200" stroke="#00C896" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />
  <text x="500" y="190" fill="#00C896" font-size="12" text-anchor="middle">Google Sign-In Token</text>

  <!-- Home -> Firestore -->
  <path d="M 300 300 L 685 300" stroke="#00C896" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />
  <text x="500" y="290" fill="#00C896" font-size="12" text-anchor="middle">Fetch Stats &amp; Leaderboard</text>

  <!-- Timer -> Room DB -->
  <path d="M 300 400 L 385 400" stroke="#00C896" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />
  <text x="350" y="390" fill="#00C896" font-size="12" text-anchor="middle">Save</text>

  <!-- Room DB -> Firestore Sync -->
  <path d="M 550 400 L 700 400 L 700 375" stroke="#FFB800" stroke-width="2" fill="none" marker-end="url(#arrow-orange)" />
  <text x="625" y="390" fill="#FFB800" font-size="12" text-anchor="middle">Background Sync</text>

  <!-- Notes -> Room DB -->
  <path d="M 300 500 L 385 500" stroke="#00C896" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />
  
  <!-- Notes -> Storage -->
  <path d="M 300 480 L 685 480" stroke="#00C896" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />
  <text x="585" y="470" fill="#00C896" font-size="12" text-anchor="middle">Upload PDF / Image</text>

  <!-- Storage -> Cloud Functions (Trigger) -->
  <path d="M 825 510 L 825 545" stroke="#FFB800" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-orange)" />
  <text x="915" y="535" fill="#FFB800" font-size="12" text-anchor="middle">onCreate() trigger extract text</text>

  <!-- AI Chat -> Cloud Functions -->
  <path d="M 300 600 L 685 600" stroke="#00C896" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />
  <text x="500" y="590" fill="#00C896" font-size="12" text-anchor="middle">POST /ai/chat (JWT Auth)</text>

  <!-- Study Rooms -> Firestore -->
  <path d="M 300 680 L 750 680 L 750 415" stroke="#00C896" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />
  <text x="500" y="670" fill="#00C896" font-size="12" text-anchor="middle">Real-time Presence Listeners</text>

  <!-- Premium -> Monetization -->
  <path d="M 300 800 L 1135 800" stroke="#00C896" stroke-width="2" fill="none" marker-end="url(#arrow-green)" />
  <text x="500" y="790" fill="#00C896" font-size="12" text-anchor="middle">In-App Purchases &amp; Ads Init</text>

  <!-- Cloud Functions -> Groq -->
  <path d="M 950 580 L 1050 580 L 1050 540 L 1135 540" stroke="#FFB800" stroke-width="2" fill="none" marker-end="url(#arrow-orange)" />
  <text x="1050" y="530" fill="#FFB800" font-size="12" text-anchor="middle">Primary AI Engine</text>

  <!-- Cloud Functions -> Cerebras -->
  <path d="M 950 640 L 1050 640 L 1050 660 L 1135 660" stroke="#FFB800" stroke-width="2" fill="none" marker-end="url(#arrow-orange)" />
  <text x="1050" y="680" fill="#FFB800" font-size="12" text-anchor="middle">Study Plan &amp; Fallback</text>

</svg>
