android-pdf-viewer = { module = "com.github.mhiew:android-pdf-viewer", version.ref = "androidPdfViewer" }
# ML Kit Document Scanner — BETA. Provides edge detection, perspective correction, multi-page
mlkit-document-scanner = { module = "com.google.android.gms:play-services-mlkit-document-scanner", version.ref = "mlkitDocumentScanner" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
